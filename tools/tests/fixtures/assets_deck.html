<!DOCTYPE html>
<html lang="en" class="deck-loading">
<head>
  <meta charset="UTF-8">
  <title>Fixture: assets deck</title>
  <style id="deck-user-styles">
    .pic { width: 400px; }
  </style>
  <script id="deck-config">
    const DECK = {
      title: 'Assets fixture',
      course: { title: '000-0000-00L Testing', type: 'Seminar', semester: 'FS26' },
      toc: ['Images'],
      date: '01.02.2026',
    };
  </script>
</head>
<body>
  <main id="deck">
    <section data-type="title"></section>
    <section data-type="toc"></section>

    <section data-type="content" id="imgs">
      <h2 class="slide-title">Images</h2>
      <div data-step="0">
        <img id="ok" src="images/eth_zurich_main_building.jpg" width="1920" height="1200" style="width:176px">
        <img id="miss" class="pic" src="images/missing_figure.png" width="800" height="400" alt="missing">
        <img id="miss-step" data-step="2" src="images/late.png" width="300" height="300" style="width:150px">
        <img id="nosize" src="images/eth_zurich_main_building.jpg" style="width:88px">
      </div>
      <div id="nosize-parent" style="width:480px" data-step="1"><img id="miss-nosize" src="images/nope.png"></div>
    </section>

    <section data-type="content" id="bgs">
      <h2 class="slide-title">Backgrounds</h2>
      <div id="bg-ok" data-bg="images/eth_zurich_main_building.jpg" data-bg-size="contain" style="width:200px;height:100px"></div>
      <div id="bg-miss" data-bg="images/gone.png" style="width:300px;height:150px"></div>
      <div id="css-url" style="width:10px;height:10px;background-image:url(images/eth_zurich_main_building.jpg)"></div>
    </section>

    <section data-type="black"></section>
  </main>

<!-- @@DECK_ENGINE@@ -->
</body>
</html>
