<!DOCTYPE html>
<html lang="en" class="deck-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentation Title — Presenter Name</title>

  <!-- ═════ USER ZONE ═════════════════════════════════════════════════════
       Edit only between USER ZONE and END USER ZONE. Guide: AUTHORING.md · all helpers: TOOLS.html
       · Steps are 0-based: data-step="0" = shown with the title, "1", "2", … = one per click,
         unmarked content = one final step.
       · Reuse components: open this file with ?dev → ▦ Components → copy the HTML.
       · Images go into images/; every img tag needs width + height (python tools/image_sizes.py fills them).
       · After every change: python tools/check.py <this folder>. Submit: python tools/pack.py <this folder>.
  ═══════════════════════════════════════════════════════════════════════ -->
  <style id="deck-user-styles">
    /* Presentation-specific CSS. Always overrides engine and component styles. */
  </style>

  <script id="deck-config">
    const DECK = {
      title:     'Presentation Title',
      subtitle:  'Authors (Year)',
      presenter: 'Presenter Name',
      course:    { title: 'Course number and name', type: 'Seminar', semester: 'FS26' },
      cover:     { background: 'images/eth_zurich_main_building.jpg', boxMaxWidth: '58%',
                   credit: 'Photo: Josip Ivanković / Unsplash' },
      toc:       ['First topic', 'Second topic', 'Third topic'],
      animations: [
        // One entry per animation file next to this deck; the order is the picker order.
        // { id: 'main', name: 'My animation', file: 'template_animations.html' },
      ],
      date:      'auto',
      canvas:    { width: 1280, height: 800 },
      hooks:     {},
    };
  </script>
</head>
<body>
  <main id="deck">
    <!-- Slide 1: title (rendered from DECK) -->
    <section data-type="title"></section>

    <!-- Slide 2: table of contents (rendered from DECK.toc) -->
    <section data-type="toc"></section>

    <!-- Main slides -->
    <section data-type="content">
      <h2 class="slide-title">Slide 3 – title</h2>
    </section>

    <section data-type="content">
      <h2 class="slide-title">Slide 4 – title</h2>
    </section>

    <section data-type="content">
      <h2 class="slide-title">Slide 5 – title</h2>
    </section>

    <!-- An animation as a slide (needs an entry in DECK.animations; data-params preset its state):
    <section data-type="animation" data-anim="main" data-params="phi=2" data-title="Animation slide title"></section>
    -->

    <!-- End of the talk: everything after the black slide is appendix -->
    <section data-type="black"></section>

    <section data-type="content">
      <h2 class="slide-title">Appendix 1 – title</h2>
    </section>
  </main>
  <!-- ═════ END USER ZONE ═════════════════════════════════════════════════ -->

<!-- @@DECK_ENGINE@@ -->
</body>
</html>
